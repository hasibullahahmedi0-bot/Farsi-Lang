[package]
name = "farsi-lang"
version = "0.1.0"
edition = "2021"
authors = ["Hasibullah Ahmedi <hasibullahahmedi0@gmail.com>"]
description = "A powerful Farsi programming language for web, desktop, data science, and scripting"
license = "MIT"
repository = "https://github.com/hasibullahahmedi0-bot/Farsi-Lang"

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "farsi"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
